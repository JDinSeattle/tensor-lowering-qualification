name: CPU qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
      - name: Runtime, contract and diagnostic regressions
        run: .venv/bin/python -m pytest -q
      - name: Verify checked-in evidence
        run: python tools/verify_evidence.py evidence/local-20260906
      - name: Recompile and execute every shape and configuration
        run: PYTHONPATH=src .venv/bin/python -m tensor_qualification.qualify --output .work/ci --samples 9 --target-cpu generic
      - name: Verify new evidence
        run: python tools/verify_evidence.py .work/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-qualification-${{ github.sha }}
          path: .work/ci
